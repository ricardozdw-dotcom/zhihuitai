[project]
name = "zhihuitai-backend"
version = "0.1.0"
description = "知汇台企业知识库中台 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "celery>=5.4",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-text-splitters>=0.3",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pypdf>=5.0",
  "python-multipart>=0.0.12",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
