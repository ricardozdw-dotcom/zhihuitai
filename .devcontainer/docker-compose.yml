services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ..:/workspaces/zhihuitai:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql+psycopg://zhihuitai:zhihuitai@postgres:5432/zhihuitai
      REDIS_URL: redis://redis:6379/0
      BLOB_DIR: /workspaces/zhihuitai/backend/data/blobs
      INGEST_INLINE: 'true'
      VITE_USE_API: 'true'
      VITE_API_BASE: /api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zhihuitai
      POSTGRES_PASSWORD: zhihuitai
      POSTGRES_DB: zhihuitai
    volumes:
      - knowledge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhihuitai -d zhihuitai']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  knowledge-pgdata:
