name: Validate and deploy Zhihuitai

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhihuitai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Build Pages demo (no backend credentials)
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
        working-directory: frontend
        env:
          VITE_USE_API: 'false'
          VITE_DEPLOYMENT_MODE: github-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zhihuitai
          POSTGRES_PASSWORD: zhihuitai
          POSTGRES_DB: zhihuitai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zhihuitai -d zhihuitai_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://zhihuitai:zhihuitai@127.0.0.1:5432/zhihuitai_test
      INGEST_INLINE: 'true'
      LLM_API_KEY: ''
      EMBEDDING_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - name: Validate full-stack environment configuration
        run: docker compose -f .devcontainer/docker-compose.yml config --quiet

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
